name: Publish to npm

# Publishes via npm Trusted Publishing (OIDC) — no NPM_TOKEN secret anywhere.
# npm verifies the short-lived OIDC token GitHub mints for this exact
# repo + workflow, so there is no long-lived credential to leak or expire.
#
# Requires a matching Trusted Publisher entry on npmjs.com:
#   Publisher:          GitHub Actions
#   Organization/user:  fengshao1227
#   Repository:         ccg-workflow
#   Workflow filename:  publish.yml
#   Environment name:   npm-publish   (must equal `environment:` below)

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Pack and validate without actually publishing'
        type: boolean
        default: false

permissions:
  contents: read
  id-token: write # mints the OIDC token npm authenticates against

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: npm-publish

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      # Deliberately NO `registry-url` here. Setting it makes setup-node write an
      # .npmrc containing //registry.npmjs.org/:_authToken=${NODE_AUTH_TOKEN},
      # and with no such secret that expands to an empty token. npm then sees
      # credentials already configured, skips the OIDC exchange entirely, and the
      # registry rejects the anonymous PUT with a misleading 404.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      # Node 22 ships npm 10.x, which has no OIDC support. Trusted publishing
      # needs >= 11.5.1. Pin to 11 — `npm@latest` floated to 12.0.2 on the
      # v3.6.5 run, printed `+ ccg-workflow@3.6.5` plus a "being processed"
      # notice, and the version never appeared on the registry (tarball 404,
      # no attestations) sixteen minutes later. 3.6.4 published on npm 11
      # without that notice and was live immediately.
      - name: Upgrade npm for OIDC support
        run: |
          npm install -g npm@11
          echo "npm $(npm --version)"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type check
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

      # A tag that disagrees with package.json ships the wrong version number
      # under the right name. Cheap to check here, impossible to undo on npm.
      - name: Verify tag matches package.json
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG="$(node -p "require('./package.json').version")"
          if [ "$TAG" != "$PKG" ]; then
            echo "::error::Tag v$TAG does not match package.json version $PKG"
            exit 1
          fi
          echo "Tag and package.json agree on $PKG"

      # Guard against re-running a tag whose version is already live — npm
      # would reject it anyway, but this fails fast with a readable reason.
      - name: Check version is not already published
        run: |
          PKG="$(node -p "require('./package.json').version")"
          if npm view "ccg-workflow@$PKG" version >/dev/null 2>&1; then
            echo "::error::ccg-workflow@$PKG is already on npm"
            exit 1
          fi
          echo "$PKG is not yet published"

      # Any configured credential silently disables the OIDC exchange, and the
      # registry then answers the anonymous PUT with a 404 that explains nothing.
      # Fail here instead, with a reason.
      - name: Assert no npm credentials are configured
        run: |
          if [ -n "${NPM_CONFIG_USERCONFIG:-}" ] && grep -q '_authToken' "$NPM_CONFIG_USERCONFIG" 2>/dev/null; then
            echo "::error::An npm auth token is configured ($NPM_CONFIG_USERCONFIG) — OIDC trusted publishing would be skipped. Remove registry-url from setup-node."
            exit 1
          fi
          echo "No npm credentials configured; OIDC exchange will be used"

      - name: Diagnose OIDC availability
        run: |
          echo "npm             : $(npm --version)"
          echo "node            : $(node --version)"
          echo "registry        : $(npm config get registry)"
          echo "userconfig      : ${NPM_CONFIG_USERCONFIG:-<unset>}"
          echo "OIDC req url set: ${ACTIONS_ID_TOKEN_REQUEST_URL:+yes}"
          echo "OIDC req tok set: ${ACTIONS_ID_TOKEN_REQUEST_TOKEN:+yes}"
          echo "--- npm config (token lines stripped) ---"
          npm config list 2>&1 | grep -viE 'token|password|auth' || true

      - name: Pack (dry run)
        if: inputs.dry_run
        run: npm pack --dry-run

      # Verbose is required to see the OIDC exchange line:
      #   npm http fetch POST <201|404> .../oidc/token/exchange/package/ccg-workflow
      # A 404 there means npm has no trusted publisher for the package (check
      # the package's Access page, not the account settings); 201 means the
      # exchange succeeded. Provenance signing is Sigstore — it can succeed
      # while npm auth still failed, so do not treat a signed statement as
      # proof the tarball landed.
      #
      # Since 2026-07-28 npm scans every publish before it is GET-able
      # (typically ~5 min, up to 15+). A first PUT that prints `+ pkg@version`
      # occupies the version as *staged*. A second PUT then 409s with
      # "Cannot publish over previously staged version" even though
      # `npm view` still 404s. That 409 means "already accepted, wait for
      # the scan" — not "try a new version".
      # https://github.blog/changelog/2026-07-28-npm-publish-time-malware-scanning-and-dual-use-metadata/
      - name: Publish
        if: ${{ !inputs.dry_run }}
        run: |
          set +e
          out=$(npm publish --provenance --access public --loglevel verbose 2>&1)
          code=$?
          printf '%s\n' "$out"
          if [ "$code" -eq 0 ]; then
            exit 0
          fi
          if printf '%s\n' "$out" | grep -qiE 'Cannot publish over previously staged version|code E409'; then
            echo "Version already staged by an earlier run — waiting for npm's publish-time scan to promote it"
            exit 0
          fi
          exit "$code"

      # `+ pkg@version` is not enough. Fail unless the registry actually
      # serves the version. Budget matches npm's documented scan window
      # (typically 5 min, up to 15+): 45 × 20s = 15 min.
      - name: Verify published version is on the registry
        if: ${{ !inputs.dry_run }}
        run: |
          PKG="$(node -p "require('./package.json').version")"
          for i in $(seq 1 45); do
            if npm view "ccg-workflow@$PKG" version >/dev/null 2>&1; then
              echo "ccg-workflow@$PKG is live on the registry"
              exit 0
            fi
            echo "attempt $i/45: ccg-workflow@$PKG not visible yet (npm scan), waiting 20s"
            sleep 20
          done
          echo "::error::ccg-workflow@$PKG is still not on the registry after 15 min. If the publish 409'd as staged, npm may be holding it for review — check the maintainer email, do not bump the version."
          exit 1
